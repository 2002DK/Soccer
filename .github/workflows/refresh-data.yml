name: Daily data refresh

# Every morning: download the latest results, and if there are new ones, update
# Elo ratings, rebuild features and refit the production model. Then refresh the
# predictions for the next 7 days' fixtures, freeze predictions for matches about
# to kick off and score finished ones. Commits and pushes only when a file
# changed; Render redeploys the API when these files change.
# The model keeps the settings chosen in its comparison (ml/models/<league>/metrics.json);
# the comparison itself is not re-run.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily; GitHub may start scheduled runs late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      LEAGUE: epl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt -r backend/requirements-dev.txt

      - name: Download results and rebuild match table
        run: python ml/scripts/pipeline.py --league "$LEAGUE" --steps download,clean

      - name: Check for new matches
        id: results
        run: |
          if git diff --quiet -- ml/data/$LEAGUE/processed/matches.csv; then
            echo "No new matches since the last refresh."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --numstat -- ml/data/$LEAGUE/processed/matches.csv
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Elo ratings, rebuild features and refit model
        if: steps.results.outputs.changed == 'true'
        run: python ml/scripts/pipeline.py --league "$LEAGUE" --steps elo,features,fit

      - name: Predict the next 7 days' fixtures, freeze and score predictions
        run: python ml/scripts/pipeline.py --league "$LEAGUE" --steps fixtures,track

      - name: Check for changed files
        id: files
        run: |
          git add -A ml/data/$LEAGUE/processed ml/models/$LEAGUE
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the prediction log only grew
        if: steps.files.outputs.changed == 'true'
        run: |
          # The tracker's log is append-only: refuse any change that removes or edits a line
          deleted=$(git diff --cached --numstat -- ml/data/$LEAGUE/processed/predictions.csv | cut -f2)
          if [ -n "$deleted" ] && [ "$deleted" != "0" ]; then
            echo "predictions.csv lost $deleted line(s); refusing to commit"; exit 1
          fi

      - name: Test the pipeline code and the API against the new data
        if: steps.files.outputs.changed == 'true'
        run: |
          python -m pytest -q ml/tests
          cd backend && python -m pytest -q

      - name: Commit and push
        if: steps.files.outputs.changed == 'true'
        run: |
          if [ "${{ steps.results.outputs.changed }}" = "true" ]; then
            last=$(python -c "import pandas as pd; print(pd.read_csv('ml/data/$LEAGUE/processed/matches.csv')['date'].max())")
            msg="Refresh data: results up to $last"
          else
            msg="Update upcoming predictions and the accuracy tracker"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git push
